<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens</title>
</head>
<body>

    <h1>Imagens de Cachorros</h1>

    <h2>Imagem com atributo alt</h2>

    <img 
        src="https://images.unsplash.com/photo-1517849845537-4d257902454a"
        alt="Cachorro feliz"
        width="400"
    >

    <h2>Imagem com largura de 300px</h2>

    <img 
        src="https://images.unsplash.com/photo-1507146426996-ef05306b995a"
        alt="Filhote de cachorro"
        width="300"
    >

    <h2>Imagem dentro de um link</h2>

    <a href="https://www.google.com" target="_blank">

        <img 
            src="https://images.unsplash.com/photo-1517423440428-a5a00ad493e8"
            alt="Cachorro correndo"
            width="250"
        >

    </a>

    <h2>Imagem com legenda</h2>

    <figure>

        <img 
            src="https://images.unsplash.com/photo-1548199973-03cce0bbc87b"
            alt="Cachorro brincando"
            width="350"
        >

        <figcaption>
            Cachorro brincando no parque.
        </figcaption>

    </figure>

</body>
</html>
