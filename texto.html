<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frases de Apoio</title>
</head>
<body>

    <h1>Frases de Apoio</h1>

    <p>
        <strong>Você é mais forte do que imagina.</strong>
    </p>

    <p>
        <em>Nunca desista dos seus sonhos.</em>
    </p>

    <p>
        <u>Cada dia é uma nova oportunidade.</u>
    </p>

    <p>
        <mark>Acredite no seu potencial.</mark>
    </p>

    <p>
        <small>Pequenos passos também levam ao sucesso.</small>
    </p>

</body>
</html>
