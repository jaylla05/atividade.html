<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>Formulário</h1>

    <form>

        <label>Nome:</label>
        <br>
        <input type="text">
        <br><br>

        <label>E-mail:</label>
        <br>
        <input type="email">
        <br><br>

        <label>Senha:</label>
        <br>
        <input type="password">
        <br><br>

        <label>Data:</label>
        <br>
        <input type="date">
        <br><br>

        <label>Curso:</label>
        <br>

        <select>
            <option>Sistemas de Informação</option>
            <option>Engenharia da Computação</option>
            <option>Ciência da Computação</option>
        </select>

        <br><br>

        <label>Turno:</label>
        <br>

        <input type="radio" name="turno"> Manhã
        <input type="radio" name="turno"> Tarde
        <input type="radio" name="turno"> Noite

        <br><br>

        <label>Interesses:</label>
        <br>

        <input type="checkbox"> Programação
        <input type="checkbox"> Banco de Dados
        <input type="checkbox"> Redes

        <br><br>

        <button type="submit">
            Enviar
        </button>

    </form>

</body>
</html>
